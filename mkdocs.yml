site_name: kalle309 github page
theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: teal
    - scheme: slate
      primary: teal
      accent: teal
  features:
    - content.code.copy
    - navigation.tabs
extra_css:
  - css/main.css
nav:
  - Home: index.md
  - Now: now.md
plugins: []
markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
